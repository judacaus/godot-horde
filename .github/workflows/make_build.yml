# Manual build of the add-on binaries for every platform listed in horde.gdextension.
# Adapted from godotengine/godot-cpp-template. Trigger it from the Actions tab; the
# merged artifact mirrors project/addons/horde/bin/.
#
# Status: not exercised yet (workflow_dispatch only works once this file is on the
# default branch). Windows, macOS and web builds are validated in milestone 3.
name: Make a GDExtension build for all supported platforms
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04, flags: "" },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm, flags: "" },
            { platform: windows, arch: x86_64, os: windows-latest, flags: "" },
            { platform: windows, arch: arm64, os: windows-latest, flags: "" },
            { platform: macos, arch: universal, os: macos-latest, flags: "" },
            { platform: android, arch: x86_64, os: ubuntu-22.04, flags: "" },
            { platform: android, arch: arm64, os: ubuntu-22.04, flags: "" },
            # Single-threaded web export (the Godot default). See docs/PLAN.md.
            { platform: web, arch: wasm32, os: ubuntu-22.04, flags: "threads=no" },
          ]
        target-type: [template_debug, template_release]
        float-precision: [single]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          # Must match the official web templates: 4.0.20 for Godot 4.6/4.7.
          em-version: 4.0.20

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} ${{ matrix.target.flags }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item project/addons/horde/bin/* -Recurse -Include *.exp,*.lib,*.pdb -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-horde-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/project/addons/horde/bin/**

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: godot-horde
          pattern: godot-horde-*
          delete-merged: true
